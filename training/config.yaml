# training/config.yaml
# Defaults - override any of these from the command line, e.g.:
#   python training/train.py --epochs 15 --batch-size 16

model:
  name: "efficientnet_b0"     # any timm model name
  pretrained: true
  freeze_backbone: false      # true = only train the classifier head initially

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  image_size: 224
  num_workers: 2
  early_stopping_patience: 5   # stop if val loss doesn't improve for N epochs
  use_class_weights: true      # helps with the long-tailed Disease_label distribution
  class_weight_power: 0.5      # square-root inverse frequency, less aggressive than 1/n
  class_weight_max: 5.0        # cap normalized weight for rare classes
  rare_class_threshold: 5       # report labels with fewer than this many train images

paths:
  checkpoint_dir: "models/checkpoints"
  history_file: "models/checkpoints/training_history.json"
